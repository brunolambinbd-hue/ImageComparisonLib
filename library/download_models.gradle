import de.undercouch.gradle.tasks.download.Download

/**
 * Script de téléchargement automatique des modèles MediaPipe.
 * Ce script est appliqué au module 'library' pour garantir que les fichiers .tflite
 * sont présents dans les assets avant la compilation.
 */

// Définition des modèles à télécharger
def models = [
        'mobilenet_v3_large.tflite': 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_large/float16/1/mobilenet_v3_large.tflite',
        'mobilenet_v3_small.tflite': 'https://storage.googleapis.com/mediapipe-models/image_embedder/mobilenet_v3_small/float16/1/mobilenet_v3_small.tflite'
]

// Dossier de destination des assets
def modelDir = file("src/main/assets")

// Création récursive du dossier si absent
if (!modelDir.exists()) {
    modelDir.mkdirs()
}

// Enregistrement des tâches de téléchargement individuelles
def downloadTasks = models.collect { modelName, modelLink ->
    tasks.register("download_${modelName.replace('.tflite','')}", Download) {
        src(modelLink)
        dest(new File(modelDir, modelName))
        overwrite(false) // Ne retélécharge pas si le fichier existe déjà
    }
}

// Tâche de regroupement
def downloadAllModelsTask = tasks.register('downloadAllModels') {
    group = 'build setup'
    description = 'Télécharge tous les modèles ML requis pour la bibliothèque.'
    dependsOn(downloadTasks)
}

// Crochet sur le cycle de vie du build
tasks.named('preBuild') {
    dependsOn(downloadAllModelsTask)
}
